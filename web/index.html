<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CogniGuide 本地 Demo</title>
  <style>
    :root { color: #eaf1ff; background: #0b1020; font-family: Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 10%, #193566 0, transparent 35%), #0b1020; }
    main { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    .eyebrow { color: #80a8ff; letter-spacing: .12em; font-size: .75rem; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.04em; }
    .intro { max-width: 740px; color: #b8c7e4; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 20px; margin-top: 28px; }
    .panel { background: #121b31e8; border: 1px solid #263556; border-radius: 18px; padding: 22px; box-shadow: 0 16px 48px #0004; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    textarea { width: 100%; min-height: 460px; resize: vertical; border: 1px solid #344568; border-radius: 12px; padding: 14px; background: #080e1c; color: #dce8ff; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: #78a6ff; color: #071127; }
    button.secondary { color: #cddaff; background: #263656; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { margin: 0 0 12px; color: #95aad0; min-height: 24px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .metric { padding: 12px; background: #0b1428; border-radius: 10px; }
    .metric small { display: block; color: #91a1be; }
    .metric b { display: block; margin-top: 3px; color: #fbfdff; }
    .gaps, .trace { display: grid; gap: 8px; }
    .gap, .event { padding: 11px; border: 1px solid #263556; border-radius: 9px; background: #0c1427; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: .72rem; background: #314b7a; color: #cfe0ff; }
    .high { background: #7d313b; color: #ffd8dd; }
    .warning { color: #ffd27f; }
    ol { padding-left: 20px; color: #c7d3ea; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } textarea { min-height: 300px; } .metric-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Agent Infra · Local Reference Runtime</div>
    <h1>CogniGuide</h1>
    <p class="intro">一个可本地运行、可审计的元认知学习分析 Demo。它以结构化学习证据为输入，由 Team Leader 调度四个专业 Agent，并在低证据或未授权时显式降级。</p>
    <div class="grid">
      <section class="panel">
        <h2>输入：学习证据 JSON</h2>
        <textarea id="payload" spellcheck="false" aria-label="学习证据 JSON"></textarea>
        <div class="actions">
          <button id="sample" class="secondary" type="button">载入示例</button>
          <button id="analyze" type="button">运行多 Agent 分析</button>
        </div>
      </section>
      <section class="panel">
        <h2>输出：可解释洞察与审计轨迹</h2>
        <p class="status" id="status">载入示例后开始运行。</p>
        <div id="result"><p class="intro">本地服务不会把原始对话文本回传到报告；输出只保留证据 ID、结构化结论与哈希审计信息。</p></div>
      </section>
    </div>
  </main>
  <script>
    const payload = document.querySelector('#payload');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const sampleButton = document.querySelector('#sample');
    const analyzeButton = document.querySelector('#analyze');

    const text = (value) => document.createTextNode(String(value ?? '—'));
    const element = (tag, className, content) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (content !== undefined) node.appendChild(text(content));
      return node;
    };

    async function loadSample() {
      const response = await fetch('/examples/python_foundations.json', { cache: 'no-store' });
      payload.value = JSON.stringify(await response.json(), null, 2);
      status.textContent = '已载入 Python 基础示例。';
    }

    function renderBlocked(data) {
      result.replaceChildren(element('p', 'warning', data.report.headline), element('p', '', data.report.summary), element('p', '', `下一步：${data.report.next_action}`));
    }

    function renderComplete(data) {
      const fragment = document.createDocumentFragment();
      fragment.append(element('p', 'warning', data.report.headline));
      const metrics = element('div', 'metric-grid');
      const calibration = data.knowledge_state.calibration;
      [
        ['校准状态', calibration.status],
        ['期望校准误差', calibration.expected_calibration_error],
        ['审计事件', data.trace.length],
      ].forEach(([label, value]) => {
        const card = element('div', 'metric');
        card.append(element('small', '', label), element('b', '', value));
        metrics.append(card);
      });
      fragment.append(metrics, element('h2', '', '待验证学习假设'));
      const gaps = element('div', 'gaps');
      (data.knowledge_state.blind_spots || []).forEach((gap) => {
        const card = element('div', 'gap');
        const tag = element('span', `tag ${gap.priority === 'high' ? 'high' : ''}`, gap.priority);
        card.append(tag, text(` ${gap.label} · 风险 ${gap.risk_score}`), element('p', '', gap.reason_codes.join(' · ')));
        gaps.append(card);
      });
      if (!gaps.children.length) gaps.append(element('p', '', '尚无足够证据支持高风险假设。'));
      fragment.append(gaps, element('h2', '', '学习路径'));
      const phases = element('ol');
      data.learning_plan.phases.forEach((phase) => phases.append(element('li', '', `${phase.name}：${phase.objective}`)));
      fragment.append(phases, element('h2', '', '审计轨迹'));
      const trace = element('div', 'trace');
      data.trace.forEach((event) => trace.append(element('div', 'event', `${event.sequence}. ${event.agent} / ${event.event} / ${event.status}`)));
      fragment.append(trace);
      result.replaceChildren(fragment);
    }

    sampleButton.addEventListener('click', () => loadSample().catch((error) => { status.textContent = `载入失败：${error.message}`; }));
    analyzeButton.addEventListener('click', async () => {
      let body;
      try { body = JSON.parse(payload.value); } catch (error) { status.textContent = `JSON 格式错误：${error.message}`; return; }
      analyzeButton.disabled = true;
      status.textContent = 'Team Leader 正在串行调度 Agent…';
      try {
        const response = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '请求失败');
        status.textContent = `运行完成：${data.status} · ${data.run_id}`;
        data.status === 'blocked' ? renderBlocked(data) : renderComplete(data);
      } catch (error) { status.textContent = `运行失败：${error.message}`; }
      finally { analyzeButton.disabled = false; }
    });
    loadSample().catch(() => {});
  </script>
</body>
</html>
